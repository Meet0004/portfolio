<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/m.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Meet Soni is a full-stack developer building secure, scalable web applications with TypeScript and Node.js." />
    <script>
      (() => {
        const savedTheme = localStorage.getItem('portfolio-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : systemPrefersDark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Meet Soni - Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
